# ============================================================
# SECRET — postgres-targeting (banco do targeting rodando NO cluster)
# ============================================================
# Guarda o usuário e a senha do PostgreSQL que roda como POD dentro do EKS.
# Este é o banco do targeting_db — diferente dos outros dois (auth e flags),
# que ficam no RDS gerenciado. Foi a solução aprovada pelo professor para
# contornar o limite de 2 instâncias RDS do Free Tier.
#
# POR QUE stringData (e não data/base64)?
# - Em "data:" os valores precisam estar em Base64 (chato e fácil de errar).
# - Em "stringData:" você escreve em texto puro e o Kubernetes converte
#   para Base64 sozinho ao aplicar. Mais simples e menos sujeito a erro.
#
# IMPORTANTE: use a MESMA senha que você definiu nos bancos RDS, para manter
# tudo padronizado. Não comite a senha real — preencha só na hora do deploy.
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: postgres-targeting-secret
  namespace: togglemaster        # mesmo namespace de todo o projeto
  labels:
    app: postgres-targeting
type: Opaque                      # tipo genérico (pares chave-valor livres)

stringData:
  # Usuário "dono" do banco. Mantemos "toggle" para bater com os bancos RDS.
  POSTGRES_USER: "toggle"

  # Senha do banco. SUBSTITUA pelo valor real (a mesma senha dos bancos RDS).
  POSTGRES_PASSWORD: "T0ggle_Fiap_2026!"
