# ============================================================
# SECRET — postgres-targeting
# ============================================================
# Credenciais do PostgreSQL que roda dentro do EKS.
# MODELO PÚBLICO: troque a senha somente na cópia local e não a comite.
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: postgres-targeting-secret
  namespace: togglemaster
  labels:
    app: postgres-targeting
type: Opaque

stringData:
  # Usuário criado pelo container oficial do PostgreSQL.
  POSTGRES_USER: "toggle"

  # Deve ser igual à senha presente no DATABASE_URL do targeting-service.
  POSTGRES_PASSWORD: "REPLACE_WITH_TARGETING_DB_PASSWORD"
