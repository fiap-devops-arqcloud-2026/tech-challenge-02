# ============================================================
# SECRET — auth-service
# ============================================================
# MODELO PÚBLICO: substitua os placeholders apenas na sua cópia local.
# Nunca comite senhas, tokens ou URLs que contenham credenciais reais.
# O Kubernetes converte stringData para data ao aplicar o manifesto.
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: togglemaster
  labels:
    app: auth-service
type: Opaque

stringData:
  # Conexão com o PostgreSQL dedicado ao auth-service.
  DATABASE_URL: "postgres://toggle:REPLACE_WITH_DB_PASSWORD@REPLACE_WITH_RDS_ENDPOINT:5432/auth_db"

  # Chave administrativa usada somente para criar chaves via POST /admin/keys.
  MASTER_KEY: "REPLACE_WITH_STRONG_RANDOM_MASTER_KEY"
