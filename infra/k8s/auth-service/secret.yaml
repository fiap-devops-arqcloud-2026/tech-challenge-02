# ============================================================
# SECRET — auth-service
# ============================================================
# Secrets armazenam dados SENSÍVEIS (senhas, tokens, URLs com credenciais).
# Os valores devem estar em Base64 — nunca em texto puro.
#
# Como gerar Base64:
#   Linux/Mac:  echo -n "seu-valor" | base64
#   PowerShell: [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("seu-valor"))
#
# ATENÇÃO: Substitua TODOS os <PLACEHOLDER> antes de aplicar com kubectl.
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: togglemaster   # mesmo namespace de todos os outros recursos do projeto
  labels:
    app: auth-service       # label para identificação e filtragem

# Opaque = tipo genérico para segredos de formato livre (pares chave-valor)
type: Opaque

data:
  # String de conexão completa com o banco RDS PostgreSQL dedicado ao auth-service
  # Formato: postgres://USUARIO:SENHA@ENDPOINT_RDS:5432/auth_db
  # Exemplo para gerar:
  #   echo -n "postgres://toggle:SuaSenha@togglemaster-auth.abc123.us-east-2.rds.amazonaws.com:5432/auth_db" | base64
  DATABASE_URL: cG9zdGdyZXM6Ly90b2dnbGU6VDBnZ2xlX0ZpYXBfMjAyNiFAdG9nZ2xlbWFzdGVyLWF1dGguYzV1a2l1Y29ndzh0LnVzLWVhc3QtMi5yZHMuYW1hem9uYXdzLmNvbTo1NDMyL2F1dGhfZGI=

  # Chave mestra usada para criar novas chaves de API via POST /admin/keys
  # Use um valor forte e aleatório — nunca o mesmo de desenvolvimento
  # Exemplo: echo -n "master-key-producao-super-secreta-123" | base64
  MASTER_KEY: dG0tbWFzdGVyLTVsUTc2bDNuWWE3TFZsRGQ1dzF2VEVDbVlLb3haalI=
