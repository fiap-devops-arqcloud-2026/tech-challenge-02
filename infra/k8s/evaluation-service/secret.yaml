# ============================================================
# SECRET — evaluation-service
# ============================================================
# Este serviço precisa de mais credenciais pois acessa a AWS (SQS)
# além de se autenticar nos outros serviços internos.
#
# NOTA SOBRE AWS CREDENTIALS:
# Para produção real, o recomendado é usar IRSA (IAM Roles for Service Accounts)
# — associa uma IAM Role diretamente ao ServiceAccount do Kubernetes,
# sem precisar de chaves de acesso estáticas. Para este desafio, usamos
# chaves estáticas por simplicidade.
#
# Como gerar Base64:
#   Linux/Mac:  echo -n "seu-valor" | base64
#   PowerShell: [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("seu-valor"))
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: evaluation-service-secret
  namespace: togglemaster
  labels:
    app: evaluation-service
type: Opaque

data:
  # Chave de API criada no auth-service para autenticação interna
  # O evaluation-service usa esta chave para chamar flag-service e targeting-service
  # Gere uma chave via: POST /admin/keys no auth-service
  # Exemplo: echo -n "tm_key_sua_chave_aqui" | base64
  SERVICE_API_KEY: dG1fa2V5X2JiMGE0MDUyZTYzNTU3NTY2YzNhYjk2ODUyMTEwN2VmYTIyOTc3MmM5YTQ2NWQ2YmM3NzExZWFiNzZiZmVmOGQ=

  # URL completa da fila SQS onde os eventos de avaliação são publicados
  # Formato: https://sqs.<REGION>.amazonaws.com/<ACCOUNT_ID>/<NOME_DA_FILA>
  # Exemplo: echo -n "https://sqs.us-east-2.amazonaws.com/123456789012/togglemaster-events" | base64
  AWS_SQS_URL: aHR0cHM6Ly9zcXMudXMtZWFzdC0yLmFtYXpvbmF3cy5jb20vODkxMzc2OTUyMzk1L3RvZ2dsZW1hc3Rlci1ldmVudHM=

  # Credenciais AWS com permissão para publicar no SQS
  # Crie um usuário IAM com a política AmazonSQSFullAccess (ou política customizada)
  # Exemplo: echo -n "AKIAIOSFODNN7EXAMPLE" | base64
  AWS_ACCESS_KEY_ID: QUtJQTQ3Q1JVNFJGVEJFREJPRzQ=

  # Chave secreta correspondente ao Access Key ID acima
  # Exemplo: echo -n "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY" | base64
  AWS_SECRET_ACCESS_KEY: eUwxNmp2bkVuRGlMMTNrZVcyVWF6RXVkTFN4c3FYYzBoZU5XQTVLag==
