# ============================================================
# SECRET — analytics-service
# ============================================================
# O analytics-service acessa SQS (para consumir mensagens) e
# DynamoDB (para salvar os eventos). Ambos requerem credenciais AWS.
#
# NOTA SOBRE AWS CREDENTIALS:
# Para produção real, prefira IRSA (IAM Roles for Service Accounts).
# Para este desafio, usamos chaves estáticas por simplicidade.
#
# Como gerar Base64:
#   Linux/Mac:  echo -n "seu-valor" | base64
#   PowerShell: [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("seu-valor"))
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: analytics-service-secret
  namespace: togglemaster
  labels:
    app: analytics-service
type: Opaque

data:
  # URL da fila SQS que o worker vai monitorar (long-polling)
  # Deve ser a mesma fila configurada no evaluation-service
  # Exemplo: echo -n "https://sqs.us-east-2.amazonaws.com/123456789012/togglemaster-events" | base64
  AWS_SQS_URL: aHR0cHM6Ly9zcXMudXMtZWFzdC0yLmFtYXpvbmF3cy5jb20vODkxMzc2OTUyMzk1L3RvZ2dsZW1hc3Rlci1ldmVudHM=

  # Credenciais AWS com permissão para SQS (ReceiveMessage, DeleteMessage)
  # e DynamoDB (PutItem) — crie uma IAM Policy customizada com apenas essas permissões
  AWS_ACCESS_KEY_ID: QUtJQTQ3Q1JVNFJGVEJFREJPRzQ=

  # Chave secreta correspondente ao Access Key ID
  AWS_SECRET_ACCESS_KEY: eUwxNmp2bkVuRGlMMTNrZVcyVWF6RXVkTFN4c3FYYzBoZU5XQTVLag==
