# ============================================================
# SECRET — analytics-service
# ============================================================
# MODELO PÚBLICO: substitua os placeholders somente na cópia local.
# Para produção, prefira credenciais temporárias via IAM Role/Pod Identity
# em vez de chaves AWS estáticas.
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: analytics-service-secret
  namespace: togglemaster
  labels:
    app: analytics-service
type: Opaque

stringData:
  # Deve apontar para a mesma fila usada pelo evaluation-service.
  AWS_SQS_URL: "https://sqs.us-east-2.amazonaws.com/REPLACE_WITH_AWS_ACCOUNT_ID/togglemaster-events"

  # Se o laboratório ainda usar credenciais estáticas, forneça uma chave
  # de menor privilégio e nunca comite o valor preenchido.
  AWS_ACCESS_KEY_ID: "REPLACE_WITH_AWS_ACCESS_KEY_ID"
  AWS_SECRET_ACCESS_KEY: "REPLACE_WITH_AWS_SECRET_ACCESS_KEY"
