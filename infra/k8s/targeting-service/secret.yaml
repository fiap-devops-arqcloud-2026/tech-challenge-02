# ============================================================
# SECRET — targeting-service
# ============================================================
# Credenciais do banco RDS dedicado ao targeting-service.
# Mesmo banco físico (postgres-app), mas banco lógico separado (targeting_db).
#
# Como gerar Base64:
#   Linux/Mac:  echo -n "seu-valor" | base64
#   PowerShell: [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("seu-valor"))
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: targeting-service-secret
  namespace: togglemaster
  labels:
    app: targeting-service
type: Opaque

data:
  # String de conexão com o RDS PostgreSQL do targeting-service
  # Formato: postgres://USUARIO:SENHA@ENDPOINT_RDS:5432/targeting_db
  # Exemplo: echo -n "postgres://toggle:SuaSenha@togglemaster-app.abc123.us-east-2.rds.amazonaws.com:5432/targeting_db" | base64
  DATABASE_URL: <BASE64_DATABASE_URL_TARGETING>
