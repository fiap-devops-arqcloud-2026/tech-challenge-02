# ============================================================
# SECRET — targeting-service
# ============================================================
# O banco targeting_db roda no cluster como StatefulSet.
# Use a mesma senha definida no Secret postgres-targeting-secret.
# MODELO PÚBLICO: preencha somente na cópia local e não comite o valor real.
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: targeting-service-secret
  namespace: togglemaster
  labels:
    app: targeting-service
type: Opaque

stringData:
  # O host é o Service interno do PostgreSQL no namespace togglemaster.
  DATABASE_URL: "postgres://toggle:REPLACE_WITH_TARGETING_DB_PASSWORD@postgres-targeting:5432/targeting_db"
