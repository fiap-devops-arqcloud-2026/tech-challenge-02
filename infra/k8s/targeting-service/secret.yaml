# ============================================================
# SECRET — targeting-service
# ============================================================
# Credenciais de conexão do targeting-service com o banco targeting_db.
# DIFERENTE dos outros serviços: este banco roda como um POD dentro do
# cluster (StatefulSet "postgres-targeting"), NÃO no RDS. Foi a solução
# aprovada pelo professor para o limite de 2 instâncias RDS do Free Tier.
#
# Como gerar Base64:
#   Linux/Mac:  echo -n "seu-valor" | base64
#   PowerShell: [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("seu-valor"))
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: targeting-service-secret
  namespace: togglemaster
  labels:
    app: targeting-service
type: Opaque

data:
  # String de conexão com o PostgreSQL que roda como POD no cluster.
  # O host é o nome do Service interno (postgres-targeting), não um endpoint RDS.
  # Formato: postgres://USUARIO:SENHA@postgres-targeting:5432/targeting_db
  # Exemplo: echo -n "postgres://toggle:SuaSenha@postgres-targeting:5432/targeting_db" | base64
  DATABASE_URL: <BASE64_DATABASE_URL_TARGETING>
