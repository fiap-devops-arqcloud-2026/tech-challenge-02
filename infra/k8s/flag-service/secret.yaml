# ============================================================
# SECRET — flag-service
# ============================================================
# Guarda as credenciais do banco RDS dedicado ao flag-service.
#
# Como gerar Base64:
#   Linux/Mac:  echo -n "seu-valor" | base64
#   PowerShell: [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("seu-valor"))
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: flag-service-secret
  namespace: togglemaster
  labels:
    app: flag-service
type: Opaque

data:
  # String de conexão com o RDS PostgreSQL dedicado ao flag-service
  # Formato: postgres://USUARIO:SENHA@ENDPOINT_RDS:5432/flags_db
  # Exemplo: echo -n "postgres://toggle:SuaSenha@togglemaster-app.abc123.us-east-1.rds.amazonaws.com:5432/flags_db" | base64
  DATABASE_URL: <BASE64_DATABASE_URL_FLAGS>
